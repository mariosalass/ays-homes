<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Técnica</title>
<meta property="og:title" content="Ficha Técnica">
<meta property="og:description" content="Ver detalles de esta publicación">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a202c;-webkit-font-smoothing:antialiased;min-height:100vh}
img{display:block;max-width:100%}
#root{min-height:100vh}

/* Spinner */
.spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;color:#64748b}
.spinner{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#1b5e6e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Gallery */
.hero-wrap{position:relative;overflow:hidden;background:#e2e8f0;max-height:360px}
.hero-wrap img{width:100%;height:360px;object-fit:cover;cursor:pointer}
.hero-count{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;pointer-events:none}
.thumbs-row{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#f1f5f9;-webkit-overflow-scrolling:touch}
.thumbs-row::-webkit-scrollbar{height:4px}
.thumbs-row::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.thumb{width:64px;height:50px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.thumb.active{border-color:#1b5e6e}

/* Body */
.ficha-body{padding:1.2rem;max-width:640px;margin:0 auto}
.ficha-type{color:#1b5e6e;font-size:13px;font-weight:600;margin-bottom:4px}
.ficha-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;line-height:1.3}
.ficha-loc{color:#64748b;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ficha-price{font-size:1.6rem;font-weight:800;color:#1b5e6e;margin-bottom:1rem}
.ficha-price span{font-size:14px;font-weight:400;color:#64748b}
.specs-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:1rem}
.spec-i{display:flex;align-items:center;gap:6px;background:#f1f5f9;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#1b5e6e}
.spec-i i{font-size:15px;opacity:.8}
.ibox{margin-bottom:1.2rem}
.ibox h3{font-size:15px;font-weight:700;margin-bottom:8px;color:#1a202c}
.ibox p{font-size:14px;color:#334155;line-height:1.75}
.am-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:#334155;border-bottom:1px solid #f1f5f9}
.am-row:last-child{border-bottom:none}
.am-row i{color:#1b5e6e;font-size:14px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;padding:15px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;margin-top:1.2rem;transition:background .2s}
.wa-btn:hover{background:#22c55e}
.wa-btn i{font-size:18px}

/* Lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;flex-direction:column;align-items:center}
.lb.open{display:flex}
.lb-top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-shrink:0}
.lb-cnt{color:rgba(255,255,255,.85);font-size:16px;font-weight:600}
.lb-cl{color:#fff;cursor:pointer;background:rgba(255,255,255,.15);border:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .2s}
.lb-cl:hover{background:rgba(255,255,255,.3)}
.lb-main{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;width:100%;padding:0 12px;min-height:0}
.lb-img{max-height:72vh;max-width:78vw;object-fit:contain;border-radius:8px;display:block}
.lb-arr{color:#fff;cursor:pointer;background:rgba(255,255,255,.15);border:none;width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .2s}
.lb-arr:hover{background:rgba(255,255,255,.3)}
.lb-ths{display:flex;gap:8px;padding:14px 20px;max-width:100vw;overflow-x:auto;flex-shrink:0}
.lb-th{width:60px;height:44px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s,opacity .2s;opacity:.5;flex-shrink:0}
.lb-th.active{border-color:#fff;opacity:1}
.lb-th img{width:100%;height:100%;object-fit:cover}

/* No-photo placeholder */
.no-photo{height:220px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:48px}

/* Error */
.error-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;color:#64748b;text-align:center;padding:2rem}
.error-wrap h2{font-size:1.4rem;font-weight:700;color:#1a202c}

@media(min-width:640px){
  .ficha-body{padding:2rem}
  .hero-wrap img{height:440px;max-height:440px}
  .hero-wrap{max-height:440px}
}
</style>
</head>
<body>

<div id="root">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb">
  <div class="lb-top">
    <span class="lb-cnt" id="lbCnt"></span>
    <button class="lb-cl" id="lbCl"><i class="fas fa-times"></i></button>
  </div>
  <div class="lb-main">
    <button class="lb-arr" id="lbPv"><i class="fas fa-chevron-left"></i></button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-arr" id="lbNx"><i class="fas fa-chevron-right"></i></button>
  </div>
  <div class="lb-ths" id="lbTh"></div>
</div>

<script>
var SB_URL = 'https://mlrglzzxrfvbkucrtffd.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1scmdsenp4cmZ2Ymt1Y3J0ZmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MDc1MTQsImV4cCI6MjA5MDQ4MzUxNH0.MI3N5PR3IkAYgBT1cHOQhxdQDcwziMWLzt3zjuLWTZM';

var params = new URLSearchParams(window.location.search);
var listingId = params.get('id');
var mode = params.get('mode') || 'client';

function escH(s){ var d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function fmtPrice(p){
  if(!p) return '';
  var n = parseFloat(String(p).replace(/[^0-9.]/g,''));
  if(isNaN(n)) return String(p);
  return n.toLocaleString('es-CR');
}

if(!listingId){
  document.getElementById('root').innerHTML =
    '<div class="error-wrap"><i class="fas fa-circle-exclamation" style="font-size:48px;color:#e2e8f0"></i>'
    +'<h2>Publicación no encontrada</h2>'
    +'<p>El link puede ser incorrecto o la publicación fue eliminada.</p></div>';
} else {
  loadListing();
}

async function loadListing(){
  try{
    var sb = supabase.createClient(SB_URL, SB_KEY);
    var res = await sb.from('listings').select('*').eq('id', listingId).single();
    if(res.error || !res.data){
      showError();
      return;
    }
    renderFicha(res.data, mode);
  } catch(e){
    showError();
  }
}

function showError(){
  document.getElementById('root').innerHTML =
    '<div class="error-wrap"><i class="fas fa-circle-exclamation" style="font-size:48px;color:#e2e8f0"></i>'
    +'<h2>No se pudo cargar la publicación</h2>'
    +'<p>Verificá tu conexión o intentá más tarde.</p></div>';
}

function renderFicha(item, mode){
  var photos = item.photos || [];
  var isBroker = mode === 'broker';
  var isProperty = item.kind === 'property';

  // Header
  var header = isBroker
    ? '<div style="background:#1b5e6e;color:#fff;padding:14px 20px;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase">Ficha Técnica</div>'
    : '<div style="background:#1b5e6e;padding:14px 20px;display:flex;align-items:center;gap:10px">'
        +'<div style="background:rgba(255,255,255,.18);border-radius:8px;padding:6px 12px;color:#fff;font-weight:800;font-size:14px">AyS</div>'
        +'<div><div style="color:#fff;font-weight:700;font-size:15px">AyS Soluciones Comerciales</div>'
        +'<div style="color:rgba(255,255,255,.7);font-size:12px">ays.homes</div></div>'
      +'</div>';

  // Gallery
  var heroImg = photos.length ? photos[0] : '';
  var galleryHtml = heroImg
    ? '<div class="hero-wrap" onclick="openGallery(0)">'
        +'<img src="'+escH(heroImg)+'" alt="'+escH(item.title||'')+'">'
        +(photos.length > 1 ? '<div class="hero-count"><i class="fas fa-images"></i> '+photos.length+' fotos</div>' : '')
      +'</div>'
    : '<div class="no-photo"><i class="fas fa-'+(isProperty?'building':'car')+'"></i></div>';

  // Price
  var priceStr = '<span class="ficha-price">'
    +(item.currency||'$')+fmtPrice(item.price)
    +(item.operation==='Alquiler' ? '<span>/mes</span>' : '')
    +'</span>';

  // Specs
  var specs = '';
  if(item.beds) specs += '<div class="spec-i"><i class="fas fa-bed"></i>'+item.beds+' hab</div>';
  if(item.baths) specs += '<div class="spec-i"><i class="fas fa-bath"></i>'+item.baths+' baños</div>';
  if(item.area) specs += '<div class="spec-i"><i class="fas fa-expand-arrows-alt"></i>'+item.area+' m²</div>';
  if(item.parking) specs += '<div class="spec-i"><i class="fas fa-car"></i>'+item.parking+' parq</div>';
  if(item.km) specs += '<div class="spec-i"><i class="fas fa-tachometer-alt"></i>'+escH(item.km)+'</div>';
  if(item.transmission) specs += '<div class="spec-i"><i class="fas fa-cog"></i>'+escH(item.transmission)+'</div>';

  // Amenidades
  var ams = (item.amenidades||[]).map(function(a){
    return '<div class="am-row"><i class="fas fa-check-circle"></i>'+escH(a)+'</div>';
  }).join('');

  // Mapa
  var mapHtml = (item.lat && item.lng)
    ? '<div class="ibox"><h3><i class="fas fa-map-location-dot" style="color:#1b5e6e;margin-right:6px"></i>Ubicación</h3>'
        +'<div id="ficha-map" style="height:220px;border-radius:12px;overflow:hidden;border:1.5px solid #e2e8f0"></div></div>'
    : '';

  // WhatsApp
  var waPhones = ['+50683215948', '+50685725465'];
  var waPhone = waPhones[Math.floor(Math.random() * waPhones.length)];
  var waMsg = 'Hola, me interesa esta publicación: '+(item.title||'')+' — '+window.location.href;
  var waBtn = '<a class="wa-btn" href="https://wa.me/'+waPhone.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(waMsg)+'" target="_blank" rel="noopener noreferrer">'
    +'<i class="fab fa-whatsapp"></i> Consultar por WhatsApp</a>';

  // Tipo de publicación
  var typeLabel = isProperty ? (item.prop_type||'Propiedad') : ((item.brand||'')+(item.year?' '+item.year:''));

  document.getElementById('root').innerHTML =
    header +
    galleryHtml +
    '<div class="ficha-body">'+
      '<p class="ficha-type">'+escH(typeLabel)+(isProperty&&item.operation?' · '+escH(item.operation):'')+'</p>'+
      '<h1 class="ficha-title">'+escH(item.title||'Sin título')+'</h1>'+
      (item.location ? '<p class="ficha-loc"><i class="fas fa-location-dot" style="color:#1b5e6e;flex-shrink:0"></i>'+escH(item.location)+'</p>' : '')+
      priceStr+
      (specs ? '<div class="specs-row">'+specs+'</div>' : '')+
      (item.description ? '<div class="ibox"><h3>Descripción</h3><p>'+escH(item.description)+'</p></div>' : '')+
      (ams ? '<div class="ibox"><h3>Amenidades</h3>'+ams+'</div>' : '')+
      mapHtml+
      (!isBroker ? waBtn : '')+
    '</div>';

  // Thumbnails debajo del hero
  if(photos.length > 1){
    var heroEl = document.querySelector('.hero-wrap');
    if(heroEl){
      var thumbsHtml = '<div class="thumbs-row">'
        + photos.map(function(url, i){
            return '<img class="thumb'+(i===0?' active':'')+'" src="'+escH(url)+'" onclick="openGallery('+i+')" loading="lazy">';
          }).join('')
        +'</div>';
      heroEl.insertAdjacentHTML('afterend', thumbsHtml);
    }
  }

  // Mapa Leaflet
  if(item.lat && item.lng){
    setTimeout(function(){
      var dMap = L.map('ficha-map', { scrollWheelZoom: false, zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(dMap);
      var pin = L.divIcon({
        html: '<div style="width:30px;height:30px;background:#1b5e6e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 12px rgba(27,94,110,.45)"></div>',
        iconSize: [30,30], iconAnchor: [15,30], className: ''
      });
      L.marker([item.lat, item.lng], { icon: pin })
        .bindPopup('<strong style="color:#1b5e6e">'+escH(item.title||'')+'</strong><br><small>'+escH(item.location||'')+'</small>')
        .addTo(dMap).openPopup();
      dMap.setView([item.lat, item.lng], 14);
      dMap.flyTo([item.lat, item.lng], 14, { duration: 1.5, easeLinearity: 0.2 });
    }, 200);
  }

  // Meta tags dinámicos para SEO y preview en WhatsApp/redes
  document.title = isBroker
    ? (item.title||'Propiedad') + ' · Ficha Técnica'
    : (item.title||'Propiedad') + ' · AyS Soluciones Comerciales';

  function setMeta(name, content, prop){
    var el = document.querySelector((prop?'[property="':'[name="')+name+'"]') || document.createElement('meta');
    if(prop) el.setAttribute('property', name);
    else el.setAttribute('name', name);
    el.setAttribute('content', content);
    if(!el.parentNode) document.head.appendChild(el);
  }

  var desc = (item.description||'').slice(0,155)
    || ((item.prop_type||'Propiedad')+' en '+(item.operation||'venta')+' en '+(item.location||'Costa Rica')+'. Precio: '+(item.currency||'$')+fmtPrice(item.price));
  var img = (item.photos && item.photos[0]) || '';
  var url = window.location.href;

  setMeta('description', desc);
  setMeta('og:title', document.title, true);
  setMeta('og:site_name', isBroker ? 'Ficha Técnica' : 'AyS Soluciones Comerciales', true);
  setMeta('og:description', desc, true);
  setMeta('og:image', img, true);
  setMeta('og:url', url, true);
  setMeta('og:type', 'website', true);
  setMeta('twitter:card', 'summary_large_image');
  setMeta('twitter:title', document.title);
  setMeta('twitter:description', desc);
  setMeta('twitter:image', img);

  // Guardar fotos para el lightbox
  galleryPhotos = photos;
}

// ── LIGHTBOX ──
var galleryPhotos = [];
var lbIdx = 0;

function openGallery(idx){
  if(!galleryPhotos.length) return;
  lbIdx = idx;
  renderLb();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderLb(){
  document.getElementById('lbImg').src = galleryPhotos[lbIdx];
  document.getElementById('lbCnt').textContent = (lbIdx+1) + ' / ' + galleryPhotos.length;
  var th = document.getElementById('lbTh');
  th.innerHTML = '';
  galleryPhotos.forEach(function(url, i){
    var d = document.createElement('div');
    d.className = 'lb-th' + (i===lbIdx?' active':'');
    d.innerHTML = '<img src="'+url+'" loading="lazy">';
    d.onclick = (function(idx){ return function(){ lbIdx=idx; renderLb(); }; })(i);
    th.appendChild(d);
  });
  // Actualizar borde en thumbnails de la página
  document.querySelectorAll('.thumb').forEach(function(t, i){ t.classList.toggle('active', i===lbIdx); });
}

function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lbCl').onclick = closeLb;
document.getElementById('lbPv').onclick = function(e){ e.stopPropagation(); lbIdx=(lbIdx-1+galleryPhotos.length)%galleryPhotos.length; renderLb(); };
document.getElementById('lbNx').onclick = function(e){ e.stopPropagation(); lbIdx=(lbIdx+1)%galleryPhotos.length; renderLb(); };
document.getElementById('lb').onclick = function(e){ if(e.target===this) closeLb(); };
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft'){ lbIdx=(lbIdx-1+galleryPhotos.length)%galleryPhotos.length; renderLb(); }
  if(e.key==='ArrowRight'){ lbIdx=(lbIdx+1)%galleryPhotos.length; renderLb(); }
});
</script>
</body>
</html>
